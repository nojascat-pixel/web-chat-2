<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>tree_proto</title>
  <style>
    html,body{margin:0;height:100%;background:#0b1420;overflow:hidden;touch-action:none}
    canvas{display:block;width:100vw;height:100vh}
    /* 解析用ビデオをあえて端に小さく表示して、動いているか確認できるようにします */
    #video { position: fixed; bottom: 10px; right: 10px; width: 80px; height: 60px; border: 1px solid #555; opacity: 0.5; z-index: 200; }
    #v-canvas { display: none; }
    .hint {
      position:fixed;left:12px;top:10px;
      font:12px/1.4 sans-serif;
      color:rgba(255,255,255,.8);
      background:rgba(0,0,0,.5);
      padding:12px 16px;border-radius:12px;
      backdrop-filter:blur(10px);
      user-select:none;pointer-events:none;
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="hint" id="status-hint">
    1. 画面を1回クリックしてください<br>
    2. 右下に自分の姿が映ったら、カメラの前で動いてください
  </div>
  
  <video id="video" autoplay playsinline muted></video>
  <canvas id="v-canvas"></canvas>
  <canvas id="c"></canvas>

  <script src="script.js"></script>
</body>
</html>
